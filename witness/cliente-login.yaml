name: cliente-login
app: https://cliente.async.dev.br
steps:
  - goto: https://cliente.async.dev.br/
  - fill: {selector: "input[type=email], input[name=email]", value: $DOMOD_CLIENT_EMAIL}
  - fill: {selector: "input[type=password], input[name=password]", value: $DOMOD_CLIENT_PASSWORD}
  - click: "button[type=submit]"
  - wait: 4000
  - expectVisible: "body"
checks:
  - noBrokenImages
