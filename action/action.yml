name: "WitnessQA"
description: "Cover the app like a user and hand you the evidence"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  mode:
    description: "cover (discover+run) or run (existing YAML)"
    required: false
    default: "cover"
  base-url:
    description: "App URL when mode=run, or single-target cover"
    required: false
    default: ""
  scenarios:
    description: "YAML dir/file for mode=run (default ./witness)"
    required: false
    default: "./witness"
  auth:
    description: "Playwright storageState JSON"
    required: false
    default: ""
  api-key:
    description: "BYOK key for root-cause (optional)"
    required: false
  model:
    description: "LLM model for cause analysis"
    required: false
    default: "openai/gpt-4o-mini"
  artifact-name:
    description: "Evidence artifact name"
    required: false
    default: "witnessqa-report"
  comment-pr:
    description: "Post verdict as PR comment"
    required: false
    default: "true"
  discord-webhook:
    description: "Discord webhook for verdict alert"
    required: false
    default: ""

outputs:
  verdict:
    description: "pass | fail | blocked"
  report-path:
    description: "Path to REPORT.html"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install WitnessQA
      shell: bash
      run: |
        npm install -g "${{ github.action_path }}"
        npx playwright install chromium --with-deps

    - name: Run WitnessQA
      id: run
      shell: bash
      env:
        WITNESS_KEY: ${{ inputs.api-key }}
        WITNESS_MODEL: ${{ inputs.model }}
        WITNESS_DISCORD_WEBHOOK: ${{ inputs.discord-webhook }}
        GH_TOKEN: ${{ github.token }}
        WITNESS_GH_PR: ${{ github.event.pull_request.number }}
      run: |
        set +e
        MODE="${{ inputs.mode }}"
        AUTH="${{ inputs.auth }}"
        BASE="${{ inputs.base-url }}"
        if [ "$MODE" = "cover" ]; then
          if [ -n "$BASE" ]; then
            EXTRA="$BASE"
          else
            EXTRA=""
          fi
          if [ -n "$AUTH" ]; then EXTRA="$EXTRA --auth $AUTH"; fi
          # shellcheck disable=SC2086
          witnessqa cover $EXTRA --no-open
        else
          ARGS=("${{ inputs.scenarios }}")
          if [ -n "$BASE" ]; then ARGS+=(--base-url "$BASE"); fi
          if [ -n "$AUTH" ]; then ARGS+=(--auth "$AUTH"); fi
          witnessqa run "${ARGS[@]}"
        fi
        CODE=$?
        set -e
        LATEST=$(ls -1d .witness/runs/*/ 2>/dev/null | grep -v explore | grep -v cover/ | tail -n 1)
        if [ -z "$LATEST" ]; then LATEST=$(ls -1d .witness/runs/*/ 2>/dev/null | tail -n 1); fi
        echo "report-path=${LATEST}REPORT.html" >> "$GITHUB_OUTPUT"
        if [ "$CODE" -eq 0 ]; then echo "verdict=pass" >> "$GITHUB_OUTPUT"
        elif [ "$CODE" -eq 2 ]; then echo "verdict=blocked" >> "$GITHUB_OUTPUT"
        else echo "verdict=fail" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$LATEST" ]; then
          node "${{ github.action_path }}/worker/src/notify.mjs" "$LATEST" || true
        fi
        exit 0

    - name: Fail job on FAIL
      if: ${{ steps.run.outputs.verdict == 'fail' }}
      shell: bash
      run: |
        echo "WitnessQA verdict=fail"
        exit 1

    - name: Upload evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.artifact-name }}
        path: .witness/runs/
        retention-days: 30

    - name: Comment on PR
      if: ${{ inputs.comment-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERDICT="${{ steps.run.outputs.verdict }}"
        REPORT="${{ steps.run.outputs.report-path }}"
        BODY="## WitnessQA · ${VERDICT^^}
        Evidence artifact: **${{ inputs.artifact-name }}**.
        Report path: \`${REPORT}\`
        <sub>evidence, not promises</sub>"
        gh pr comment "${{ github.event.number }}" --body "$BODY"
